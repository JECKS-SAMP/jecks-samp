name: Notify Discord on Main Commit

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send commit notifications to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DC_WEBHOOK_URL }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 -m pip install --quiet requests

          python3 <<'PY'
          import json
          import os
          import sys
          import requests

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "")
          event_path = os.environ.get("GITHUB_EVENT_PATH", "")

          if not webhook_url:
              sys.exit("Missing DISCORD_WEBHOOK_URL secret")

          if not os.path.isfile(event_path):
              sys.exit(f"GitHub event file not found: {event_path!r}")

          with open(event_path, encoding="utf-8") as f:
              event = json.load(f)

          commits = event.get("commits", [])

          if not commits:
              print("No commits found in this push.")
              sys.exit(0)

          repo = event.get("repository", {}).get(
              "full_name", "unknown/repository"
          )
          branch = event.get("ref", "").removeprefix("refs/heads/")

          for commit in commits:
              sha = commit.get("id", "")
              message = commit.get("message", "(no message)")
              author = (commit.get("author") or {}).get(
                  "name", "Unknown"
              )
              commit_url = commit.get("url", "")

              embed = {
                  "title": "New commit pushed to main",
                  "description": message[:4000],
                  "color": 5793266,
                  "fields": [
                      {
                          "name": "Repository",
                          "value": repo[:1024],
                          "inline": True
                      },
                      {
                          "name": "Branch",
                          "value": branch[:1024] or "main",
                          "inline": True
                      },
                      {
                          "name": "Author",
                          "value": author[:1024] or "Unknown",
                          "inline": True
                      },
                      {
                          "name": "Commit",
                          "value": f"`{sha[:7]}`",
                          "inline": True
                      }
                  ],
                  "footer": {"text": "GitHub Actions"}
              }

              if commit_url.startswith("https://github.com/"):
                  embed["url"] = commit_url

              payload = {
                  "username": "GitHub Commit Bot",
                  "allowed_mentions": {"parse": []},
                  "embeds": [embed]
              }

              try:
                  response = requests.post(
                      webhook_url,
                      json=payload,
                      timeout=20
                  )

                  if response.status_code in (200, 204):
                      print(f"Sent {sha[:7]}: HTTP {response.status_code}")
                  else:
                      print(
                          f"Discord returned HTTP {response.status_code}"
                      )
                      print(f"Discord response: {response.text[:1000]}")
                      sys.exit(1)

              except requests.RequestException as error:
                  print(f"Request failed: {type(error).__name__}: {error}")
                  sys.exit(1)
          PY
